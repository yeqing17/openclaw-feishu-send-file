name: Package and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package .skill file
        run: |
          python3 -c "
          import zipfile, pathlib, sys
          skill = pathlib.Path('.')
          name = 'openclaw-feishu-send-file'
          excluded = {'.git', '__pycache__', 'node_modules'}
          out = pathlib.Path('dist') / f'{name}.skill'
          out.parent.mkdir(parents=True)
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(skill.rglob('*')):
                  if f.is_symlink(): continue
                  if any(p in excluded for p in f.parts): continue
                  if not f.is_file(): continue
                  z.write(f, pathlib.Path(name) / f.relative_to(skill))
                  print(f'  {pathlib.Path(name) / f.relative_to(skill)}')
          print(f'\nDone: {out} ({out.stat().st_size} bytes)')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
